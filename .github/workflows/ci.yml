# One job: the test suite on Linux, offline (`cargo fetch --locked` first, then no network but loopback inside
# scripts/nonet.sh). The full gate (`./check.sh full`: fmt, clippy, line budget, cargo deny, cooldown, the release
# build, binary size) and the macOS and Windows runs happen on the maintainer's machines before every release
# (CONTRIBUTING.md); the release workflow builds every shipped target. Actions are pinned by commit SHA.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0 # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28, prebuilt binaries
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo fetch --locked
      - run: scripts/nonet.sh cargo nextest run --locked --offline --features fake --no-fail-fast
        env:
          CARGO_NET_OFFLINE: "true"
